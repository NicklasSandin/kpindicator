# checkout.kpindicator.com — the PHP checkout.
#
# Install:  sudo cp checkout/deploy/nginx-checkout.conf /etc/nginx/conf.d/
#           sudo certbot --nginx -d checkout.kpindicator.com
#           sudo nginx -t && sudo systemctl reload nginx
#
# certbot rewrites the listen/ssl lines in place, so run it after copying.
# Matches the box this was written for: nginx 1.26, PHP 8.3 FPM, AlmaLinux 10.

server {
    listen 80;
    listen [::]:80;
    server_name checkout.kpindicator.com;

    # Document root is the app's public/ directory. Nothing above it —
    # .env, src/, views/ — is reachable over HTTP.
    root /var/www/kpindicator.com/checkout/public;
    index index.php;

    access_log /var/log/nginx/checkout.kpindicator.com.access.log;
    error_log  /var/log/nginx/checkout.kpindicator.com.error.log;

    # Stripe posts webhooks here; everything else is a buyer's browser.
    client_max_body_size 1m;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include        fastcgi_params;
        fastcgi_pass   unix:/run/php-fpm/www.sock;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  HTTPS on;

        # A slow Stripe API call must not 504 mid-payment.
        fastcgi_read_timeout 60s;
    }

    # Long-lived caching for the two static assets, which are content-stable.
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Belt and braces: never serve a dotfile even if the root is misconfigured.
    location ~ /\. {
        deny all;
        return 404;
    }
}
